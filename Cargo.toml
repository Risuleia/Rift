[workspace]
resolver = "3"

members = [
    "apps/cli", "crates/content",
    "crates/core", "crates/direct-link", "crates/discovery", "crates/identity",
    "crates/protocol",
    "crates/transfer",
    "crates/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Risuleia/Rift"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"